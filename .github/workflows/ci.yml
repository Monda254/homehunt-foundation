name: CI Foundation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --prefer-offline

      - name: Run Lint checks
        run: pnpm run lint

      - name: Run Test checks
        run: npx vitest run

      - name: Run Build checks
        env:
          VERCEL: "1"
          SUPABASE_URL: "https://ljffnleivjgbzyoajapk.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_wcrajNTOgB_9myTj7jI8jA_pbL0Zivo"
        run: pnpm run build
